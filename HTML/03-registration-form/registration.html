<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <!-- Link the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <header>
            <h1>Create Your Account</h1>
            <p>Please fill out the form below to create your account</p>
        </header>

        <!--Main Content-->
        <main>
            <form action="#" method="post" enctype="multipart/form-data">
                
                <!--Personal-Information-->
                <fieldset>
                    <legend>Personal Information</legend>
                    
                    <div class="input-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="Enter your first name" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Enter your last name" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+92 300 1234567" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                </fieldset>

                <!--Account-Information-->
                <fieldset>
                    <legend>Account Information</legend>
                    
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required>
                    </div>

                    <!--Gender-->
                    <div class="radio-checkbox-group">
                        <label class="group-label">Gender</label>
                        <div class="options-list">
                            <label><input type="radio" id="male" name="gender" value="Male" required> Male</label>
                            <label><input type="radio" id="female" name="gender" value="Female"> Female</label>
                            <label><input type="radio" id="other" name="gender" value="Other"> Other</label>
                        </div>
                    </div>

                    <!--Country-->
                    <div class="input-group">
                        <label for="country">Country</label>
                        <select id="country" name="country" required>
                            <option value="">Select Country</option>
                            <option value="Pakistan">Pakistan</option>
                            <option value="India">India</option>
                            <option value="China">China</option>
                            <option value="USA">USA</option>
                            <option value="UK">United Kingdom</option>
                        </select>
                    </div>

                    <!--Skills-->
                    <div class="radio-checkbox-group">
                        <label class="group-label">Skills</label>
                        <div class="options-list">
                            <label><input type="checkbox" id="skill-html" name="skills" value="HTML"> HTML</label>
                            <label><input type="checkbox" id="skill-css" name="skills" value="CSS"> CSS</label>
                            <label><input type="checkbox" id="skill-js" name="skills" value="JavaScript"> JavaScript</label>
                            <label><input type="checkbox" id="skill-react" name="skills" value="React"> React</label>
                        </div>
                    </div>

                    <!--File-Upload-->
                    <div class="input-group">
                        <label for="profile-picture">Profile Picture</label>
                        <input type="file" id="profile-picture" name="profile-picture">
                    </div>

                    <div class="input-group">
                        <label for="website">Portfolio Website</label>
                        <input type="url" id="website" name="website" placeholder="https://yourportfolio.com">
                    </div>

                    <!--Experience-->
                    <div class="input-group">
                        <label for="experience">Years of Experience</label>
                        <input type="number" id="experience" name="experience" min="0" max="40">
                    </div>

                    <!--Satisfaction-->
                    <div class="input-group">
                        <label for="satisfaction">Satisfaction Level (1-10)</label>
                        <input type="range" id="satisfaction" name="satisfaction" min="1" max="10">
                    </div>

                    <!--About-->
                    <div class="input-group">
                        <label for="about">About Yourself</label>
                        <textarea id="about" name="about" rows="4" placeholder="Write something about yourself..."></textarea>
                    </div>

                    <!--Terms-->
                    <div class="terms-accept">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the Terms and Conditions</label>
                    </div>
                </fieldset>

                <!--Buttons-->
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Register</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
