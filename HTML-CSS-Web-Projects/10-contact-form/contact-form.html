<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Contact Form built using HTML5.">
    <title>Contact Us - Get in Touch</title>
    <!-- Link the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contact-container">
        <!-- Header -->
        <header>
            <h1>Contact Us</h1>
            <p>Fill out the form below and our team will get back to you soon.</p>
        </header>

        <!-- Main Form -->
        <main>
            <form action="#" method="post" autocomplete="on">
                
                <!-- Personal Information -->
                <fieldset>
                    <legend>Personal Information</legend>

                    <div class="input-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required minlength="3" maxlength="50">
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>

                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+92-300-1234567">
                    </div>

                    <div class="input-group">
                        <label for="website">Website</label>
                        <input type="url" id="website" name="website" placeholder="https://yourwebsite.com">
                    </div>

                    <div class="input-group">
                        <label for="date">Preferred Contact Date</label>
                        <input type="date" id="date" name="date">
                    </div>
                </fieldset>

                <!-- Gender -->
                <div class="option-group">
                    <label class="group-title">Gender</label>
                    <div class="options">
                        <label><input type="radio" id="male" name="gender" value="Male"> Male</label>
                        <label><input type="radio" id="female" name="gender" value="Female"> Female</label>
                        <label><input type="radio" id="other" name="gender" value="Other"> Other</label>
                    </div>
                </div>

                <!-- Subject -->
                <div class="input-group">
                    <label for="subject">Choose a Subject *</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a topic</option>
                        <optgroup label="General">
                            <option value="inquiry">General Inquiry</option>
                            <option value="feedback">Feedback</option>
                        </optgroup>
                        <optgroup label="Support">
                            <option value="tech-support">Technical Support</option>
                            <option value="bug-report">Bug Report</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Interests -->
                <div class="option-group">
                    <label class="group-title">Interests</label>
                    <div class="options">
                        <label><input type="checkbox" id="html" name="interest" value="HTML"> HTML</label>
                        <label><input type="checkbox" id="css" name="interest" value="CSS"> CSS</label>
                        <label><input type="checkbox" id="javascript" name="interest" value="JavaScript"> JavaScript</label>
                    </div>
                </div>

                <!-- File Upload -->
                <div class="input-group">
                    <label for="file">Attachment (Optional)</label>
                    <input type="file" id="file" name="file">
                </div>

                <!-- Message -->
                <div class="input-group">
                    <label for="message">Your Message *</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required maxlength="500"></textarea>
                </div>

                <!-- Terms -->
                <div class="terms-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the Terms & Conditions.</label>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn btn-submit">Submit Message</button>
                    <button type="reset" class="btn btn-reset">Reset Form</button>
                </div>
            </form>
        </main>

        <!-- Footer -->
        <footer>
            <p>© 2026 Contact Form Demo. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
